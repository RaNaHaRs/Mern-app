<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Data Recovery CRM - Enterprise workflow management for data recovery labs" />
    <meta name="theme-color" content="#0f1117" />
    <title>RecoverLab CRM — Enterprise Data Recovery Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="error-display" style="color: red; background: black; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 99999; position: fixed; top: 0; left: 0; right: 0; display: none;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += '\n[ERROR] ' + e.message + '\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += '\n[PROMISE] ' + (e.reason ? e.reason.stack || e.reason : 'Unhandled Promise Rejection');
      });
      const originalConsoleError = console.error;
      console.error = function(...args) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += '\n[REACT] ' + args.join(' ');
        originalConsoleError.apply(console, args);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
